name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri build

      - name: Scan packaged binaries with Microsoft Defender
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning "MpCmdRun.exe not found; skipping Defender scan."; exit 0 }
          $targets = Get-ChildItem "src-tauri/target/release" -Recurse -File -Include *.exe
          if (-not $targets) { throw "No Windows executable was produced." }
          foreach ($target in $targets) {
            Write-Host "Defender scan: $($target.FullName)"
            & $mp -Scan -ScanType 3 -File $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender reported a problem for $($target.Name) (exit code $LASTEXITCODE)." }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "No NSIS installer was produced." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"


      - name: Publish complete source tree with Windows executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_WORKSPACE
          $installerDir = Join-Path $repo "windows/src-tauri/target/release/bundle/nsis"
          $portable = Join-Path $repo "windows/src-tauri/target/release/windows-ia-assistant.exe"
          $publish = Join-Path $env:RUNNER_TEMP "windows-ia-assistant-prebuilt"
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }

          git fetch origin main prebuilt
          git worktree add --detach $publish origin/main
          New-Item -ItemType Directory -Force -Path (Join-Path $publish "downloads/windows") | Out-Null

          $installers = Get-ChildItem $installerDir -Filter *.exe -File
          if (-not $installers) { throw "No installer executable found." }
          Copy-Item $installers.FullName (Join-Path $publish "downloads/windows") -Force
          if (Test-Path (Join-Path $installerDir "SHA256SUMS.txt")) {
            Copy-Item (Join-Path $installerDir "SHA256SUMS.txt") (Join-Path $publish "downloads/windows/SHA256SUMS.txt") -Force
          }
          if (Test-Path $portable) {
            Copy-Item $portable (Join-Path $publish "downloads/windows/windows-ia-assistant-portable.exe") -Force
          }

          @"
          # Windows IA Assistant — prebuilt Windows files

          This branch contains the complete source tree plus the latest Windows executables generated by GitHub Actions.

          Executables:
          - downloads/windows/*.exe — NSIS installer
          - downloads/windows/windows-ia-assistant-portable.exe — portable build, when produced
          - downloads/windows/SHA256SUMS.txt — SHA-256 checksums

          These binaries are generated by the main branch build workflow and should be replaced only by the workflow.
          "@ | Set-Content (Join-Path $publish "downloads/windows/README.md") -Encoding UTF8

          Push-Location $publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/windows
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Windows executables for $env:GITHUB_SHA"
          }
          git push origin HEAD:prebuilt --force
          Pop-Location
          git worktree remove $publish --force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-IA-Assistant-installer
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable executable when produced
        uses: actions/upload-artifact@v4
        with:
          name: Windows-IA-Assistant-portable
          path: windows/src-tauri/target/release/windows-ia-assistant.exe
          if-no-files-found: ignore
          retention-days: 30
