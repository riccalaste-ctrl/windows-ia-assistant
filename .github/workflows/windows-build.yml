name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri build

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "No NSIS installer was produced." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-IA-Assistant-installer
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable executable when produced
        uses: actions/upload-artifact@v4
        with:
          name: Windows-IA-Assistant-portable
          path: windows/src-tauri/target/release/windows-ia-assistant.exe
          if-no-files-found: ignore
          retention-days: 30
